title: N-central Root Code Execution Via syslog-ng Audit Export Injection
id: 9d1f3a7c-6e82-4b05-a4d9-1c7e5b2f8a30
status: experimental
description: >
  Detects root code execution stemming from the Able2Shell Audit Export / syslog-ng
  injection and passwordless syslog-installer paths. N-central interpolates an unsanitized
  serverIp into a generated syslog-ng config; a program() destination then runs as root
  when syslog-ng reloads, under SELinux context syslogd_t. Two detections: a child process
  spawned under syslogd_t that is not syslog-ng itself, and anomalous program() directives
  in the generated syslog-ng configuration files. Requires auditd / Sysmon-for-Linux and,
  for the config arm, file-integrity monitoring on /etc/syslog-ng/.
author: Lars Ostmann
date: 2026/11/10
references:
  - https://thecybersecguru.com/news/able2shell-n-central-zero-days-n-able-cloud-shutdown/
  - https://defusedcyber.com/
  - https://github.com/Oracle-Security/CVEs/blob/main/0-Days/N-Central%20N-Able/
logsource:
  category: process_creation
  product: linux
detection:
  selection_context:
    SELinuxContext|contains: 'syslogd_t'
  selection_exec:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/python'
      - '/python3'
      - '/perl'
      - '/nc'
      - '/ncat'
  filter_legit:
    Image|endswith:
      - '/syslog-ng'
      - '/syslog-ng-ctl'
  condition: selection_context and selection_exec and not filter_legit
falsepositives:
  - Legitimate syslog-ng helper invocations (allowlist by full path / command line)
level: critical
tags:
  - attack.privilege_escalation
  - attack.execution
  - attack.t1068
  - attack.t1059.004