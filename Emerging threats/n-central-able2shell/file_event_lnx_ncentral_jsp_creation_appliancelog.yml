title: N-central Unexpected JSP File Creation In Appliance Log Directory
id: 6d63d8a1-3c61-4e9e-a31e-9b2f4c7a1d05
status: experimental
description: >
  Detects creation of a .jsp file under /opt/nable/webapps/ROOT/applianceLog/. No
  legitimate N-central function writes a JSP into this directory; this is the web-shell
  staging step of the Able2Shell chain, executed as the nable user. The file is deleted
  immediately after execution, so alert on CREATE (and, if sequence telemetry allows,
  create-then-delete in quick succession). Requires auditd / Sysmon-for-Linux file
  monitoring on the appliance, which is not present by default.
author: Lars Ostmann
date: 2026/11/10
references:
  - https://blog.ostorlab.co/n-able-n-central-rce-33-zero-days-able2shell.html
  - https://defusedcyber.com/
  - https://github.com/Oracle-Security/CVEs/blob/main/0-Days/N-Central%20N-Able/
logsource:
  category: file_event
  product: linux
detection:
  selection:
    TargetFilename|contains: '/opt/nable/webapps/ROOT/applianceLog/'
    TargetFilename|endswith: '.jsp'
  condition: selection
falsepositives:
  - None expected; legitimate N-central updates do not drop JSPs into applianceLog
level: critical
tags:
  - attack.persistence
  - attack.execution
  - attack.t1505.003