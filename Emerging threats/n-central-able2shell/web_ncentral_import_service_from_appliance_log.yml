title: N-central Service Import From Staged Appliance Log File
id: 8c42e6b1-5d79-4a3f-b1e2-0c9d7a6f3b21
status: experimental
description: >
  Detects ImportServiceFromFile SOAP operations on /dms/services/ServerUI where the
  FilePath points into the applianceLog directory - the trigger used to parse an
  attacker-staged file and reach XML external-entity processing. Requires WAF / proxy
  request-body capture.
author: Lars Ostmann
date: 2026/11/10
references:
  - https://horizon3.ai/attack-research/attack-blogs/n-able-n-central-from-n-days-to-0-days/
  - https://defusedcyber.com/
  - https://github.com/Oracle-Security/CVEs/blob/main/0-Days/N-Central%20N-Able/
logsource:
  category: waf
detection:
  selection_endpoint:
    RequestUri|contains: '/dms/services/ServerUI'
  selection_method:
    RequestBody|contains|all:
      - 'ImportServiceFromFile'
      - 'FilePath'
  selection_path:
    RequestBody|contains: '/applianceLog/'
  condition: selection_endpoint and selection_method and selection_path
falsepositives:
  - Authorized service imports (should not reference the applianceLog path)
level: high
tags:
  - attack.initial_access
  - attack.t1190