title: N-central Application Administrator Creation Via ServerEI2 userAdd
id: 1e4b8a60-7c3d-42f9-a5e1-6f0c2b9d8a47
status: experimental
description: >
  Detects a userAdd SOAP call to the N-central ServerEI2 endpoint creating an
  administrator (userroleID 1002). This is the privilege-gain stage of the chain and is
  an APPLICATION-level account add - it never creates a Linux/sudo OS account, so OS
  account-creation rules will miss it. Requires WAF / proxy request-body capture.
  Pair with the application audit-log variant for higher fidelity.
author: Lars Ostmann
date: 2026/11/10
references:
  - https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/
  - https://defusedcyber.com/
  - https://github.com/Oracle-Security/CVEs/blob/main/0-Days/N-Central%20N-Able/
logsource:
  category: waf
detection:
  selection_endpoint:
    RequestUri|contains: '/dms2/services2/ServerEI2'
  selection_useradd:
    RequestBody|contains|all:
      - 'userAdd'
      - 'userroleID'
  selection_role:
    RequestBody|contains: '1002'
  condition: selection_endpoint and selection_useradd and selection_role
falsepositives:
  - Legitimate administrator provisioning via the EI2 API from a trusted integration/source (allowlist those sources)
level: critical
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1136